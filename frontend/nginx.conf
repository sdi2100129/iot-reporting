# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name localhost;

    return 301 https://$host$request_uri;
}


server {
    # Listen on an HTTPS port 
    listen 443 ssl;
    server_name localhost;

    # Use these certificates as public and private key
    ssl_certificate /etc/nginx-certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx-certs/nginx-selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        #   send to the backend the ip adress of the browser that requested it that is saved in  $remote_addr with X-Real-IP header.
        proxy_set_header X-Real-IP $remote_addr;
        #   send to the backend the ip adress of the intermediate proxies
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
