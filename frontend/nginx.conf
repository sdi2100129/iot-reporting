server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        #   send to the backend the ip adress of the browser that requested it that is saved in  $remote_addr with X-Real-IP header.
        proxy_set_header X-Real-IP $remote_addr;
        #   send to the backend the ip adress of the intermediate proxies
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
