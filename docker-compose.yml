services:
  db:
    image: postgres:15
    container_name: iot-db
    restart: always
    environment:
      POSTGRES_DB: iot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    container_name: iot-backend
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: iot
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: iot-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
